<app-layout title="Mon profil">
  <div *ngIf="message" class="alert alert-success mb-3">{{ message }}</div>
  <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>
  <div *ngIf="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>

  <div class="row g-3" *ngIf="!loading && profil">
    <div class="col-lg-7">
      <div class="content-card">
        <div class="section-title mb-3">Informations</div>
        <form [formGroup]="form" (ngSubmit)="enregistrer()">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Prénom</label><input class="form-control" formControlName="firstName"></div>
            <div class="col-md-6"><label class="form-label">Nom</label><input class="form-control" formControlName="lastName"></div>
            <div class="col-md-6"><label class="form-label">Email / Identifiant</label><input class="form-control" [value]="profil.email" disabled></div>
            <div class="col-md-6"><label class="form-label">Téléphone</label><input class="form-control" formControlName="phone"></div>

            <ng-container *ngIf="isPrestataire">
              <div class="col-12"><hr class="my-1"><div class="form-label" style="font-weight:700">Profil prestataire</div></div>
              <div class="col-md-6"><label class="form-label">Spécialité</label><input class="form-control" formControlName="specialite"></div>
              <div class="col-md-3"><label class="form-label">Tarif horaire (€)</label><input type="number" class="form-control" formControlName="tarifHoraire"></div>
              <div class="col-md-3 d-flex align-items-end">
                <div class="form-check"><input type="checkbox" class="form-check-input" id="dispo" formControlName="disponibilite"><label class="form-check-label ms-1" for="dispo">Disponible</label></div>
              </div>
              <div class="col-12">
                <label class="form-label">Compétences (séparées par des virgules)</label>
                <input class="form-control" [(ngModel)]="competencesText" [ngModelOptions]="{standalone:true}" placeholder="Angular, Spring Boot, UX">
              </div>
            </ng-container>

            <ng-container *ngIf="isClient">
              <div class="col-12"><hr class="my-1"><div class="form-label" style="font-weight:700">Profil entreprise</div></div>
              <div class="col-md-6"><label class="form-label">Domaine d'activité</label><input class="form-control" formControlName="domaineActivite"></div>
              <div class="col-md-6"><label class="form-label">SIRET</label><input class="form-control" formControlName="siret"></div>
              <div class="col-md-8"><label class="form-label">Adresse</label><input class="form-control" formControlName="adresse"></div>
              <div class="col-md-4"><label class="form-label">Nombre d'employés</label><input type="number" class="form-control" formControlName="nombreEmployes"></div>
            </ng-container>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn-primary-gradient" [disabled]="saving">
              <span *ngIf="saving" class="spinner-border spinner-border-sm"></span> Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="col-lg-5" *ngIf="isPrestataire">
      <div class="content-card">
        <div class="section-title mb-2">Mon abonnement</div>
        <p style="font-size:.82rem;color:var(--saas-muted)">
          Pack actuel : <strong>{{ profil.packNom || 'Aucun (essai gratuit : 1 client)' }}</strong><br>
          Statut du compte : <span [class]="badge(profil.statutCompte || '')">{{ profil.statutCompte }}</span>
        </p>
        <label class="form-label">Souscrire à un pack (paiement par virement)</label>
        <select class="form-select mb-2" [(ngModel)]="selectedPackId">
          <option [ngValue]="null">— Choisir un pack —</option>
          <option *ngFor="let pk of packs" [ngValue]="pk.id">{{ pk.nom }} — {{ pk.prix }} € / {{ pk.dureeMois }} mois</option>
        </select>
        <button class="btn-primary-gradient w-100" (click)="souscrire()" [disabled]="souscribing">
          <i class="bi bi-credit-card"></i> Demander la souscription
        </button>

        <div class="mt-3">
          <div class="form-label" style="font-weight:700">Historique</div>
          <div *ngFor="let a of abonnements" class="d-flex justify-content-between align-items-center py-2"
               style="border-bottom:1px solid var(--saas-border);font-size:.82rem">
            <span>{{ a.packNom }} <span style="color:var(--saas-muted)">({{ a.dateDebut }})</span></span>
            <span [class]="badge(a.statut)">{{ a.statut }}</span>
          </div>
          <div *ngIf="abonnements.length===0" class="text-muted py-2" style="font-size:.8rem">Aucun abonnement.</div>
        </div>
      </div>
    </div>
  </div>
</app-layout>
