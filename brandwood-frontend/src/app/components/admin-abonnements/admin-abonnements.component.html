<app-layout title="Validation des abonnements">
  <div *ngIf="message" class="alert alert-success mb-3">{{ message }}</div>
  <div *ngIf="error" class="alert alert-danger mb-3">{{ error }}</div>

  <div class="content-card">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div class="section-title">Abonnements <span class="count-pill">{{ abonnements.length }}</span></div>
      <select class="form-select" style="width:auto" [(ngModel)]="filtreStatut" (change)="charger()">
        <option value="">Tous</option>
        <option *ngFor="let s of statuts" [value]="s">{{ s }}</option>
      </select>
    </div>

    <div *ngIf="loading" class="text-center py-4"><div class="spinner-border text-primary"></div></div>

    <div class="table-responsive" *ngIf="!loading">
      <table class="table align-middle">
        <thead>
          <tr><th>Prestataire</th><th>Pack</th><th>Méthode</th><th>Début</th><th>Fin</th><th>Statut</th><th class="text-end">Action</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let a of abonnements">
            <td>{{ a.prestataireNom }}</td>
            <td>{{ a.packNom }}</td>
            <td>{{ a.methodePaiement }}</td>
            <td>{{ a.dateDebut || '—' }}</td>
            <td>{{ a.dateFin || '—' }}</td>
            <td><span [class]="badge(a.statut)">{{ a.statut }}</span></td>
            <td class="text-end">
              <button class="btn-primary-gradient" style="padding:.4rem .8rem;font-size:.78rem"
                      *ngIf="a.statut==='EN_ATTENTE'" (click)="valider(a)">
                <i class="bi bi-check2"></i> Valider
              </button>
              <span *ngIf="a.statut!=='EN_ATTENTE'" class="text-muted" style="font-size:.8rem">—</span>
            </td>
          </tr>
          <tr *ngIf="abonnements.length===0"><td colspan="7" class="text-center text-muted py-4">Aucun abonnement.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</app-layout>
