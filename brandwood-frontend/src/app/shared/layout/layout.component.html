<div class="dashboard-wrapper">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-logo">SaaS Client</div>
    <div class="sidebar-section-label">Navigation</div>
    <nav>
      <a *ngFor="let item of navItems" class="nav-link" [routerLink]="item.route"
         routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        <i class="bi" [ngClass]="item.icon"></i>{{ item.label }}
      </a>
    </nav>
    <div class="mt-3 mb-2" style="border-top:1px solid var(--saas-border);"></div>
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-left"></i> Se déconnecter
    </button>
    <div class="sidebar-user mt-2">
      <div class="sidebar-avatar">
        {{ (user?.firstName?.charAt(0) || '') + (user?.lastName?.charAt(0) || '') | uppercase }}
      </div>
      <div style="min-width:0;">
        <div class="sidebar-user-name text-truncate">{{ user?.firstName }} {{ user?.lastName }}</div>
        <div class="sidebar-user-role">{{ userTypeLabel }}</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="dashboard-main">
    <header class="top-navbar">
      <div class="page-title">{{ title }}</div>
      <div class="d-flex align-items-center gap-3">
        <app-notification-bell></app-notification-bell>
        <span [class]="userTypeBadgeClass">{{ userTypeLabel }}</span>
      </div>
    </header>

    <div class="dashboard-content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
