server.port=8081

# ── MySQL 8 ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/saas_client?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── SQL Init (schema.sql + data.sql) ─────────────────────────────────────────
spring.sql.init.mode=always
spring.sql.init.platform=mysql
spring.jpa.defer-datasource-initialization=true

# ── JWT ───────────────────────────────────────────────────────────────────────
# En production, definir la variable d'environnement JWT_SECRET (>= 256 bits).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-in-production-must-be-at-least-256-bits-long-0123456789}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Email ─────────────────────────────────────────────────────────────────────
# MAIL_DEV_MODE=true (defaut) : le code n'est PAS envoye par SMTP ; il est loggue
#   dans la console du backend ET renvoye dans la reponse (devCode) -> la page de
#   verification pre-remplit les 6 chiffres. Aucune configuration requise.
# Pour un ENVOI REEL via Gmail : definir
#   MAIL_DEV_MODE=false
#   MAIL_USERNAME=ton.adresse@gmail.com
#   MAIL_PASSWORD=<mot de passe d'application Google 16 caracteres>
app.mail.dev-mode=${MAIL_DEV_MODE:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── Assistant IA (chatbot + fonctionnalites IA) ───────────────────────────────
# Optionnel : definir ANTHROPIC_API_KEY pour activer les reponses generees par
# Claude. Sans cle, le moteur heuristique local repond (fallback).
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}

# ── App ───────────────────────────────────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:4200}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.saasclient=DEBUG
logging.level.org.springframework.security=WARN
